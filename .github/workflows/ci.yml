name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: night-shift-html-${{ github.sha }}
          path: dist/html
          if-no-files-found: error

  itch:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: itch-upload
      cancel-in-progress: false
    steps:
      - name: Check for the itch.io key
        id: gate
        env:
          ITCH_TOKEN: ${{ secrets.ITCH_TOKEN }}
        run: |
          if [ -z "$ITCH_TOKEN" ]; then echo 'enabled=false' >> $GITHUB_OUTPUT; echo '::notice::ITCH_TOKEN not set, skipping itch.io upload'; else echo 'enabled=true' >> $GITHUB_OUTPUT; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: night-shift-html-${{ github.sha }}
          path: dist/html

      - name: Work out the version
        id: version
        if: steps.gate.outputs.enabled == 'true'
        run: echo "version=$(node -p "require('./package.json').version")+${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Upload to itch.io
        if: steps.gate.outputs.enabled == 'true'
        uses: Ayowel/butler-to-itch@fe309f460564d406d71dac3654d758a9aa4a57f9 # v1
        with:
          butler_key: ${{ secrets.ITCH_TOKEN }}
          itch_user: goosey-games
          itch_game: ${{ vars.ITCH_GAME || 'night-shift' }}
          version: ${{ steps.version.outputs.version }}
          files: |
            html dist/html
